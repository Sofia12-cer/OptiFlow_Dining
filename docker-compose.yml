services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: .env
    environment:
      ROUTING_SERVICE_URL: http://routing:8001
      VISION_SERVICE_URL: http://vision:8002
      DJANGO_DB_PATH: /data/db.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - optiflow_db:/data
      # Plano editable (mesas creadas/movidas/unificadas). Se inicializa con config/salon.json
      # la primera vez; después persiste entre reconstrucciones. Para volver al plano del repo:
      #   docker compose down && docker volume rm optiflow_dining_optiflow_config
      - optiflow_config:/app/config
    depends_on:
      - routing
      - vision
    restart: unless-stopped
  routing:
    build:
      context: .
      dockerfile: services/routing/Dockerfile
    expose:
      - "8001"
    restart: unless-stopped
  vision:
    build:
      context: .
      dockerfile: services/vision/Dockerfile
    expose:
      - "8002"
    restart: unless-stopped
volumes:
  optiflow_db:
  optiflow_config:
